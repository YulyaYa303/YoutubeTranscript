<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Краткое содержание, ключевые тезисы и полный текст видео с YouTube.">
  <title>Видео словами</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="masthead"><a class="brand" href="/"><span class="logo" aria-hidden="true">“</span> Видео словами</a></header>
    <section class="hero" aria-labelledby="page-title">
      <div class="intro">
        <h1 id="page-title">Видео<br>словами<span>.</span></h1>
        <p>Главная мысль, ключевые тезисы и&nbsp;полный текст видео по одной ссылке.</p>
      </div>
      <form class="form" id="transcript-form">
        <div class="signal" aria-hidden="true"><div class="wave"></div><div class="play"><i></i></div><div class="lines"><i></i><i></i><i></i><i></i></div></div>
        <div class="fields">
          <label for="video-url">Ссылка на видео</label>
          <input type="url" id="video-url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="url" inputmode="url" maxlength="2048" required>
          <button class="submit" type="submit"><span id="button-label">Получить текст</span><span class="arrow" aria-hidden="true"></span></button>
          <button id="example" class="example" type="button">Подставить пример ссылки</button>
          <p class="status" id="status" role="status"></p>
        </div>
      </form>
    </section>
    <div id="results" hidden>
      <div class="spread">
        <section class="abstract"><h2 id="summary-title" tabindex="-1">Краткое содержание</h2><p id="summary"></p>
          <figure id="length-chart" hidden><figcaption>Объём в словах</figcaption>
            <div class="chart-row"><span>Резюме</span><span class="track"><i id="short-bar"></i></span><b id="short-count"></b></div>
            <div class="chart-row"><span>Транскрипт</span><span class="track"><i></i></span><b id="full-count"></b></div>
          </figure></section>
        <section id="points-panel" class="points"><h2>Ключевые тезисы</h2><ul id="points"></ul></section>
      </div>
      <section class="full">
        <div class="full-head"><h2>Полный транскрипт</h2><p id="wordcount"></p></div>
        <p id="transcript"></p>
      </section>
    </div>
  </main>
</body>
</html>
