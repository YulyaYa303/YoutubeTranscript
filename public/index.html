<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Краткое содержание на русском и полный транскрипт видео с YouTube.">
  <title>Видео словами</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <a class="brand" href="/">Видео словами</a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="intro">
        <h1 id="page-title">Видео<br>словами<span class="period">.</span></h1>
        <p>Краткое содержание на русском и полный текст видео с YouTube.</p>
      </div>

      <form class="form" id="transcript-form">
        <span class="video-mark" aria-hidden="true"></span>
        <label for="video-url">Ссылка на видео</label>
        <input type="url" id="video-url" name="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="url" inputmode="url" maxlength="2048" required>
        <button type="submit">Получить текст <span class="arrow" aria-hidden="true"></span></button>
        <p class="status" id="status" role="status"></p>
      </form>
    </section>

    <div id="results" class="results" hidden>
      <section aria-labelledby="summary-title">
        <h2 tabindex="-1" id="summary-title">Краткое содержание</h2>
        <p id="summary"></p>
      </section>
      <section aria-labelledby="transcript-title">
        <h2 id="transcript-title">Полный транскрипт</h2>
        <p id="transcript"></p>
      </section>
    </div>
  </main>
</body>
</html>
